<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Share Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-glow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
        }
        .bg-glow .orb:nth-child(1) {
            width: 400px; height: 400px;
            background: #fe2c55;
            top: -100px; left: -100px;
            animation-delay: 0s;
        }
        .bg-glow .orb:nth-child(2) {
            width: 350px; height: 350px;
            background: #25f4ee;
            bottom: -80px; right: -80px;
            animation-delay: -3s;
        }
        .bg-glow .orb:nth-child(3) {
            width: 300px; height: 300px;
            background: #6c5ce7;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 15px) scale(0.95); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .header .logo svg {
            width: 48px; height: 48px;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fe2c55, #25f4ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: #888;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Glass card */
        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 32px;
            backdrop-filter: blur(20px);
            margin-bottom: 24px;
            transition: border-color 0.3s;
        }
        .card:hover {
            border-color: rgba(255,255,255,0.12);
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666;
            margin-bottom: 20px;
        }

        /* Input group */
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: #fe2c55;
            box-shadow: 0 0 0 3px rgba(254, 44, 85, 0.15);
        }
        .input-group input::placeholder {
            color: #555;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 160px;
            gap: 12px;
        }

        /* Start button */
        .btn-start {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #fe2c55, #d62548);
            color: #fff;
        }
        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(254, 44, 85, 0.35);
        }
        .btn-start:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-start .shimmer {
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            100% { left: 100%; }
        }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 20px 16px;
            text-align: center;
            transition: all 0.4s;
        }
        .stat-box.success { border-color: rgba(37, 244, 238, 0.2); }
        .stat-box.fail { border-color: rgba(254, 44, 85, 0.2); }
        .stat-box.total { border-color: rgba(108, 92, 231, 0.2); }

        .stat-box .stat-value {
            font-size: 2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin-bottom: 6px;
        }
        .stat-box.success .stat-value { color: #25f4ee; }
        .stat-box.fail .stat-value { color: #fe2c55; }
        .stat-box.total .stat-value { color: #a29bfe; }

        .stat-box .stat-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        /* Progress bar */
        .progress-wrap {
            margin-bottom: 20px;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .progress-header .pct {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
        }
        .progress-header .req-s {
            font-size: 0.8rem;
            color: #888;
            font-weight: 500;
        }
        .progress-track {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #fe2c55, #25f4ee);
            width: 0%;
            transition: width 0.5s ease;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: progress-shimmer 1.5s infinite;
        }
        @keyframes progress-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Status badge */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
        }
        .status-dot.idle { background: #555; }
        .status-dot.running {
            background: #25f4ee;
            animation: pulse 1.5s infinite;
        }
        .status-dot.done { background: #00b894; }
        .status-dot.error { background: #fe2c55; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(37, 244, 238, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(37, 244, 238, 0); }
        }
        .status-text {
            font-size: 0.85rem;
            color: #aaa;
        }

        /* Log area */
        .log-area {
            margin-top: 16px;
            max-height: 200px;
            overflow-y: auto;
            padding: 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            color: #666;
            line-height: 1.6;
        }
        .log-area .log-line {
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .log-line.info { color: #25f4ee; }
        .log-line.success { color: #00b894; }
        .log-line.error { color: #fe2c55; }
        .log-line.warn { color: #fdcb6e; }

        /* Video ID badge */
        .video-id-badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(108, 92, 231, 0.15);
            border: 1px solid rgba(108, 92, 231, 0.3);
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #a29bfe;
            font-family: 'Courier New', monospace;
            margin-top: 8px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* Completed animation */
        .completed-banner {
            text-align: center;
            padding: 24px;
            display: none;
        }
        .completed-banner.show { display: block; }
        .completed-banner h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #00b894;
            margin-bottom: 4px;
        }
        .completed-banner p {
            color: #888;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .stats-grid { grid-template-columns: 1fr; }
            .input-row { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-glow">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M34.1 10.3A7.5 7.5 0 0127.5 4h-5.4v27.7a4.5 4.5 0 11-3.8-4.4V21.8a10 10 0 109.3 10V18.2A13 13 0 0038 21.1v-5.5a7.5 7.5 0 01-3.9-5.3z" fill="url(#grad1)"/>
                    <defs>
                        <linearGradient id="grad1" x1="12" y1="4" x2="38" y2="40" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#fe2c55"/>
                            <stop offset="1" stop-color="#25f4ee"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>TikTok Share Bot</h1>
            <p>Boost your video shares instantly</p>
        </div>

        <!-- Config Card -->
        <div class="card" id="configCard">
            <div class="card-title">Configuration</div>
            <div class="input-row">
                <div class="input-group">
                    <label>TikTok Video URL</label>
                    <input type="text" id="videoUrl" placeholder="https://vt.tiktok.com/..." value="https://vt.tiktok.com/zs9rcfhds/">
                </div>
                <div class="input-group">
                    <label>Share Count</label>
                    <input type="number" id="shareAmount" placeholder="1000" value="1000" min="1" max="100000">
                </div>
            </div>
            <button class="btn-start" id="btnStart" onclick="startBot()">
                <span class="shimmer"></span>
                Launch Shares
            </button>
        </div>

        <!-- Progress Card -->
        <div class="card" id="progressCard">
            <div class="card-title">Progress</div>

            <div class="progress-wrap">
                <div class="progress-header">
                    <span class="pct" id="pctText">0%</span>
                    <span class="req-s" id="reqsText">-- req/s</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box success">
                    <div class="stat-value" id="statSuccess">0</div>
                    <div class="stat-label">Successful</div>
                </div>
                <div class="stat-box fail">
                    <div class="stat-value" id="statFailed">0</div>
                    <div class="stat-label">Failed</div>
                </div>
                <div class="stat-box total">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Total Sent</div>
                </div>
            </div>

            <div class="status-bar">
                <div class="status-dot idle" id="statusDot"></div>
                <span class="status-text" id="statusText">Waiting to start...</span>
            </div>

            <div id="videoIdContainer" style="margin-top:12px; display:none;">
                <span class="video-id-badge" id="videoIdBadge"></span>
            </div>

            <div class="completed-banner" id="completedBanner">
                <h2>All Done!</h2>
                <p>Your shares have been sent successfully.</p>
            </div>

            <div class="log-area" id="logArea"></div>
        </div>
    </div>

    <script>
        let polling = null;
        let lastSent = 0;
        let lastTime = Date.now();

        function addLog(msg, type = '') {
            const area = document.getElementById('logArea');
            const line = document.createElement('div');
            line.className = 'log-line ' + type;
            const now = new Date().toLocaleTimeString();
            line.textContent = '[' + now + '] ' + msg;
            area.appendChild(line);
            area.scrollTop = area.scrollHeight;
        }

        async function startBot() {
            const btn = document.getElementById('btnStart');
            const url = document.getElementById('videoUrl').value.trim();
            const amount = parseInt(document.getElementById('shareAmount').value) || 1000;

            if (!url) {
                addLog('Please enter a TikTok URL', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Starting...';

            addLog('Starting share bot...', 'info');
            addLog('URL: ' + url, 'info');
            addLog('Target: ' + amount + ' shares', 'info');

            try {
                const resp = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, amount: amount })
                });
                const data = await resp.json();

                if (data.error) {
                    addLog('Error: ' + data.error, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Launch Shares';
                    return;
                }

                addLog('Bot started!', 'success');
                startPolling();

            } catch (e) {
                addLog('Connection error: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Launch Shares';
            }
        }

        function startPolling() {
            if (polling) return;
            lastSent = 0;
            lastTime = Date.now();
            polling = setInterval(pollStatus, 500);
        }

        async function pollStatus() {
            try {
                const resp = await fetch('/api/status');
                const d = await resp.json();

                // Stats
                document.getElementById('statSuccess').textContent = d.successful.toLocaleString();
                document.getElementById('statFailed').textContent = d.failed.toLocaleString();
                document.getElementById('statTotal').textContent = d.sent.toLocaleString();

                // Progress
                const pct = d.target > 0 ? Math.min((d.sent / d.target) * 100, 100) : 0;
                document.getElementById('pctText').textContent = pct.toFixed(1) + '%';
                document.getElementById('progressFill').style.width = pct + '%';

                // Req/s
                const now = Date.now();
                const elapsed = (now - lastTime) / 1000;
                if (elapsed >= 1) {
                    const rps = Math.round((d.sent - lastSent) / elapsed);
                    document.getElementById('reqsText').textContent = rps + ' req/s';
                    lastSent = d.sent;
                    lastTime = now;
                }

                // Status dot
                const dot = document.getElementById('statusDot');
                const txt = document.getElementById('statusText');
                txt.textContent = d.status_msg;

                if (d.completed) {
                    dot.className = 'status-dot done';
                    if (d.status_msg.startsWith('ERROR')) {
                        dot.className = 'status-dot error';
                        addLog(d.status_msg, 'error');
                    } else {
                        document.getElementById('completedBanner').classList.add('show');
                        addLog('Completed! ' + d.successful + '/' + d.sent + ' successful', 'success');
                    }
                    clearInterval(polling);
                    polling = null;
                    document.getElementById('btnStart').disabled = false;
                    document.getElementById('btnStart').textContent = 'Launch Shares';
                } else if (d.started) {
                    dot.className = 'status-dot running';
                }

                // Video ID
                if (d.video_id) {
                    document.getElementById('videoIdContainer').style.display = 'block';
                    document.getElementById('videoIdBadge').textContent = 'Video ID: ' + d.video_id;
                }

            } catch (e) {
                // ignore transient fetch errors
            }
        }

        // Auto-poll on load in case bot is already running
        pollStatus();
    </script>
</body>
</html>
